<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus — Task Manager</title><link rel="stylesheet" href="style.css"></head><body><div class="shell"><header><a class="logo">focus<span>.</span></a><div class="date">Today · 24 September</div><button id="theme">◐</button></header><main><section class="intro"><p class="eyebrow">MY WORKSPACE</p><h1>Make progress.<br><span>One task at a time.</span></h1><div class="progress"><div><span id="count"></span><b id="pct">40%</b></div><div class="track"><i id="bar"></i></div></div></section><section class="task-box"><form id="form"><input id="task" placeholder="Add a task..." autocomplete="off"><button>Add task</button></form><div class="filters"><button class="filter active" data-f="all">All</button><button class="filter" data-f="open">Open</button><button class="filter" data-f="done">Completed</button></div><ul id="tasks"><li class="done"><button class="check">✓</button><span>Finish portfolio project section</span><button class="delete">×</button></li><li class="done"><button class="check">✓</button><span>Review responsive mobile layout</span><button class="delete">×</button></li><li><button class="check"></button><span>Publish portfolio to GitHub Pages</span><button class="delete">×</button></li><li><button class="check"></button><span>Update LinkedIn profile</span><button class="delete">×</button></li><li><button class="check"></button><span>Build next JavaScript project</span><button class="delete">×</button></li></ul></section></main></div><script src="script.js"></script></body></html>
